name: Bach development experiment
on:
  push:
    branches: [main, attack-dsl-prototype]
    paths:
      - 'harmonizer/attack/**'
      - 'rules/**'
      - 'experiments/bach-development.json'
      - '.github/workflows/bach-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev,experiment]'
      - uses: actions/cache@v4
        with:
          path: artifacts/feature-cache
          key: bach-features-${{ runner.os }}-${{ hashFiles('harmonizer/attack/*.py', 'rules/**/*.harmony', 'rules/*.harmony', 'experiments/bach-development.json') }}
      - run: python -m harmonizer.attack.benchmark --proposals rules/proposals/round-001.harmony
      - uses: actions/upload-artifact@v4
        with:
          name: bach-development
          path: artifacts/bach-development.json
          retention-days: 14
